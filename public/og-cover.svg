<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183829" />
      <stop offset="55%" stop-color="#12291E" />
      <stop offset="100%" stop-color="#091610" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD4A0" />
      <stop offset="50%" stop-color="#C8A86B" />
      <stop offset="100%" stop-color="#9B7B3E" />
    </linearGradient>
    <radialGradient id="spot" cx="76%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#C8A86B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#C8A86B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="910" cy="315" r="320" fill="url(#spot)" />

  <!-- Architectural Gold Border -->
  <rect x="36" y="36" width="1128" height="558" rx="24" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" rx="16" fill="none" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.18" />

